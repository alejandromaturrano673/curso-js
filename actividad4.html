<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Construir un CUESTIONARIO (5 interrogantes) -->
    <!-- Por cada Pregunta -->
    <!-- 3 alternativas -->
    <!-- Utilizar botones de desplazamiento para la navegacion -->
    <!-- Los datos que se iran mostrando deben estar en un OBJETO -->

    <div>
      <h1 id="titulo"></h1>
      <h3 id="subtitulo"></h3>
      <p id="pregunta"></p>
      <ul>
        <li id="item1"></li>
        <li id="item2"></li>
        <li id="item3"></li>
      </ul>
    </div>
    <button id="anterior">anterior</button>
    <button id="siguiente">siguiente</button>

    <script>
      const cuestionario = {
        titulo: "Cuestionario",
        contenido: [
          {
            pregunta: "que es una base de datos?",
            alternativas: ["A", "B", "C"],
          },
          {
            pregunta: "que es un lenguaje de programacion?",
            alternativas: ["D", "E", "F"],
          },
          {
            pregunta: "que es una sistema operativo?",
            alternativas: ["G", "H", "I"],
          },
          {
            pregunta: "que es una computadora?",
            alternativas: ["J", "K", "L"],
          },
          {
            pregunta: "que es una laptop?",
            alternativas: ["M", "N", "Ñ"],
          },
        ],
      };

      const titulo = document.getElementById("titulo");
      const subtitulo = document.getElementById("subtitulo");
      const pregunta = document.getElementById("pregunta");
      const item1 = document.getElementById("item1");
      const item2 = document.getElementById("item2");
      const item3 = document.getElementById("item3");
      const anterior = document.getElementById("anterior");
      const siguiente = document.getElementById("siguiente");

      let numero = 0;
      function actualizarCuestionario() {
        titulo.innerHTML = cuestionario.titulo;
        subtitulo.innerHTML = `Pregunta - ${numero + 1}`;

        const preguntaActual = cuestionario.contenido[numero];

        pregunta.innerHTML = preguntaActual.pregunta;
        item1.innerHTML = preguntaActual.alternativas[0];
        item2.innerHTML = preguntaActual.alternativas[1];
        item3.innerHTML = preguntaActual.alternativas[2];
      }

      actualizarCuestionario();

      anterior.addEventListener("click", function () {
        if (numero > 0) {
          numero--;
          actualizarCuestionario();
        }
      });
      siguiente.addEventListener("click", function () {
        if (numero < cuestionario.contenido.length - 1) {
          numero++;
          actualizarCuestionario();
        }
      });
    </script>
  </body>
</html>
