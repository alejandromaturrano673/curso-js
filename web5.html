<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
  </head>
  <body>
    <section class="section">
      <div class="container">
        <div class="columns is-centered">
          <div class="column is-half">
            <form action="" autocomplete="off" id="formulario" class="box">
              <div class="field">
                <label for="apellidos" class="label">Apellidos</label>
                <input
                  type="text"
                  id="apellidos"
                  minlength="3"
                  required
                  class="input"
                />
              </div>

              <div class="field">
                <label for="nombres" class="label">Nombres</label>
                <input
                  type="text"
                  id="nombres"
                  minlength="3"
                  required
                  class="input"
                />
              </div>

              <div class="field">
                <label for="fechanac" class="label">Fecha nacimiento</label>
                <input
                  type="date"
                  id="fechanac"
                  min="1999-12-31"
                  max="2026-10-20"
                  required
                  class="input"
                />
              </div>

              <div class="field">
                <label for="email" class="label">Correo electrónico</label>
                <input type="email" id="email" required class="input" />
              </div>

              <div class="field">
                <label for="experiencia" class="label">Experiencia :</label>
                <input
                  type="number"
                  min="0"
                  max="30"
                  id="experiencia"
                  required
                  class="input"
                />
              </div>

              <div class="field">
                <label for="cargo" class="label">Cargo</label>
                <div class="select">
                  <select name="cargo" id="cargo" required>
                    <option value=""></option>
                    <option value="1">Analista</option>
                    <option value="2">Programador</option>
                    <option value="3">Jefe</option>
                  </select>
                </div>
              </div>

              <div>
                <button type="submit" class="button">Enviar</button>
                <button type="reset" class="button">Reiniciar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <script>
      //Vamos a detener el evento submit (envio)
      //El evento submit está asociado al formulario y NO al botón
      const formulario = document.getElementById("formulario");

      //Gestión de eventos
      formulario.addEventListener("submit", function (event) {
        event.preventDefault();

        if (confirm("¿Está seguro de proceder?")) {
          alert("guardado correctamente ... ");
        }
      });
    </script>
  </body>
</html>
